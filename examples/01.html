
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 1 · Flexbox</title>

  <style>
    /* 페이지 전체 배경을 하늘색으로 설정 */
    html, body {
      background-color: skyblue !important;
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 20px;
    }

    /* 부모 요소에 Flexbox 적용 */
    .container {
      display: flex;
      background-color: skyblue;
      min-height: 200px;
      padding: 20px;
      gap: 10px;
    }
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — CSS가 적용된 견본 문서입니다.</p>

  <ul>
    <li>목록 1. 사과</li>
    <li>목록 2. 바나나</li>
    <li>목록 3</li>
  </ul>

  <div class="box">div.box</div>
  <button>버튼</button>

</body>
</html>
